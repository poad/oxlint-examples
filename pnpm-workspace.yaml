packages:
  - non-frontend/**
  - frontend/**
  - aws-cdk/**

allowBuilds:
  '@parcel/watcher': false
  '@swc/core': false
  esbuild: false
  sharp: false
  unrs-resolver: false

blockExoticSubdeps: true

minimumReleaseAge: 10080 # 7 days in minutes

minimumReleaseAgeExclude:
  - pnpm@12.23.0

  - '@solidjs/compiler@2.0.2'
  - '@solidjs/compiler-darwin-arm64@2.0.2'
  - '@solidjs/compiler-darwin-x64@2.0.2'
  - '@solidjs/compiler-linux-arm64-gnu@2.0.2'
  - '@solidjs/compiler-linux-x64-gnu@2.0.2'
  - '@solidjs/compiler-wasm32-wasi@2.0.2'
  - '@solidjs/compiler-win32-x64-msvc@2.0.2'
  - '@solidjs/router@2.0.0'
  - '@solidjs/signals@2.0.3'
  - '@solidjs/vite-plugin@3.0.1'
  - '@solidjs/web@2.0.3'
  - solid-js@2.0.3
  
  - '@next/env@16.4.6'
  - '@next/swc-darwin-arm64@16.4.6'
  - '@next/swc-darwin-x64@16.4.6'
  - '@next/swc-linux-arm64-gnu@16.4.6'
  - '@next/swc-linux-arm64-musl@16.4.6'
  - '@next/swc-linux-x64-gnu@16.4.6'
  - '@next/swc-linux-x64-musl@16.4.6'
  - '@next/swc-win32-arm64-msvc@16.4.6'
  - '@next/swc-win32-x64-msvc@16.4.6'
  - next@16.4.6
  - minimatch@11.0.1
  - glob@14.0.2
  - '@isaacs/nonrecursive-glob-match@1.0.1'
  - path-scurry@3.0.0

overrides:
  '@solidjs/compiler': 2.0.2
  glob@>=9.0.0 <=14.0.1: ^14.0.2
  minimatch@<11.0.1: ^11.0.1
  semver: '>=7'
  seroval@<=1.6.2: ^1.6.3

trustPolicy: no-downgrade
